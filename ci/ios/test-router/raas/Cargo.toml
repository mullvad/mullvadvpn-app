[package]
name = "raas"
version = "0.1.0"
edition = "2021"
description = "RaaS stands for Router as a Service"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
axum = "0.7"
env_logger = "0.10"
futures = "0.3"
ipnetwork = { version = "0.21", features = ["serde"] }
log = "0.4"
mnl = { version = "0.3.1", features = ["mnl-1-0-4"] }
nftnl = { version = "0.9", features = ["nftnl-1-1-0"] }
once_cell = "1"
pcap = { version = "1.2.0", features = ["capture-stream"] }
pcap-file-tokio = "0.1"
pnet_packet = "0.34"
serde = { version = "1.0.138", features = ["derive"] }
thiserror = "1"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
uuid = { version = "1", features = ["serde"] }

# This crate is excluded from the workspace, so it cannot inherit the lints.
# Keep in sync with `[workspace.lints]` in the repository root `Cargo.toml`.
[lints.clippy]
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
borrow_as_ptr = "warn"
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unicode_not_nfc = "warn"
unused_async = "deny"
wildcard_dependencies = "deny"

[lints.rust]
absolute_paths_not_starting_with_crate = "deny"
# Easy to read style and opinionated best practices
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "deny"
missing_abi = "deny"
# Security
non_ascii_idents = "forbid"
# Deny old style Rust
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
