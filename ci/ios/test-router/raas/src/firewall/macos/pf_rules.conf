# never NAT the router's own traffic; without this, replies from local
# services get their source port rewritten and the client discards them
no nat on wan_if from (wan_if) to any

# NAT what the router forwarded for its clients, who all live on the LAN.
# Scoped by address, not by tag: translation rules do not reliably honor
# tagged on this platform, and an unscoped nat hijacks local replies
nat on wan_if from (wan_if:network) to any -> (wan_if)

# redirect the clients' plain HTTP for 8.8.8.8 to the local web server, at the
# sink: packets translated to a local address at wan_if never reach the local
# stack on this kernel, while delivery from the sink works. No pass modifier,
# so the filter rule below owns the state
rdr on sink_utun inet proto tcp from any to 8.8.8.8 port 80 -> (wan_if) port 80

# exclude multicast traffic from utun
pass in quick on wan_if inet from any to { (wan_if), (wan_if:broadcast), 224.0.0.0/4, 255.255.255.255 } flags any no state

# anything else arriving on wan_if is client traffic
pass in quick on wan_if route-to source_utun inet from any to any flags any no state

# the redirect's state lives at the sink, if-bound so the client's follow-up
# packets cannot match it at wan_if and take the utun path like their SYN did
pass in quick on sink_utun inet proto tcp from any to (wan_if) port 80 flags any keep state (if-bound)

# everything else userspace injects into sink_utun is client traffic
pass in quick on sink_utun all flags any tag PHONE no state

# steer the local server's replies out through the sink, where the redirect
# state lives, so their source is translated back to the mocked address and
# they return to the client through userspace like all other return traffic
pass out quick on wan_if route-to (sink_utun sink_peer) inet proto tcp from (wan_if) port 80 to (wan_if:network) flags any no state

# reply-to on the state steers replies back into sink_utun (rules are skipped for state matches)
pass out quick on wan_if reply-to (sink_utun sink_peer) flags any tagged PHONE keep state (if-bound)
