# Never inspect traffic on loopback
set skip on lo0

# ---- NAT ----
# Do not NAT traffic originating from the Mac itself
no nat on wan_if from (wan_if) to any
# Also do not NAT traffic from the Mac's own IP that arrives on sink_utun
no nat on sink_utun from (wan_if) to any
# NAT any other client traffic on the wan_if network to the Mac's IP
nat on sink_utun from (wan_if:network) to any -> (wan_if)

# --- 8.8.8.8:80 redirect -------------------------------------------------
# Redirect traffic destined for 8.8.8.8:80 to the local web server on wan_if:80
rdr on sink_utun inet proto tcp from any to 8.8.8.8 port 80 -> (wan_if) port 80

# Allow traffic to the Mac itself, broadcasts, multicast
pass in quick on wan_if inet from any to (wan_if) no state
pass in quick on wan_if inet from any to (wan_if:broadcast) no state
pass in quick on wan_if inet from any to 224.0.0.0/4 no state
pass in quick on wan_if inet from any to 255.255.255.255 no state

# Redirect any client traffic into raas
pass in quick on wan_if route-to (source_utun (source_utun:peer)) inet from !(wan_if) to any no state

# Pass the redirected traffic and create rdr state on sink_utun.
# This rule must be BEFORE the general sink_utun rule.
pass in quick on sink_utun inet proto tcp from any to (wan_if) port 80 keep state (if-bound)

# Force replies from the local web server back into sink_utun so the rdr state
# can reverse-translate the source back to 8.8.8.8:80.
pass out quick on wan_if route-to (sink_utun (sink_utun:peer)) inet proto tcp from (wan_if) port 80 to any no state
# -------------------------------------------------------------------------

# General sink_utun traffic (everything else raas injects)
pass in quick on sink_utun all tag PHONE no state

# Let tagged traffic out to the internet
pass out quick on wan_if tagged PHONE keep state

# General return traffic
pass in quick on wan_if inet all keep state
pass out quick on wan_if inet all keep state
