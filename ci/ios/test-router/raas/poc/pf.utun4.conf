# NAT: rewrite source to 10.0.0.1 when leaving utun4
# nat on utun4 inet from 192.168.91.0/24 to any -> utun4 round-robin

nat on en0 inet tagged UTUN_SINK -> (en0)

# Policy route: force traffic from the client into utun4
pass in quick on en0 from 192.168.91.84 to any route-to utun4 flags any keep state

pass in quick on sink_utun inet tagged UTUN_SINK keep state

pass in quick on utun4 inet from any to 192.168.91.84 keep state
pass out quick on en0 inet from any to 192.168.91.84 keep state
