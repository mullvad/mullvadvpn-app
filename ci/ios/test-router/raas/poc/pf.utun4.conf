# NAT what the router forwarded for its clients
nat on wan_if from any to any tagged PHONE -> (wan_if)

# hand the clients' plain HTTP for 8.8.8.8 to the local web server; pass skips
# the filter rules, so this flow never detours through the utuns
rdr pass on wan_if inet proto tcp from any to 8.8.8.8 port 80 -> (wan_if) port 80

# local, multicast and broadcast traffic is not ours to route; a negated list
# would expand into rules that match everything, so exclude with a rule instead
pass in quick on wan_if inet from any to { (wan_if), (wan_if:broadcast), 224.0.0.0/4, 255.255.255.255 } flags any no state

# anything else arriving on wan_if is client traffic
pass in quick on wan_if route-to source_utun inet from any to any flags any no state

# everything userspace injects into sink_utun is client traffic
pass in quick on sink_utun all flags any tag PHONE no state

# reply-to on the state steers replies back into sink_utun (rules are skipped for state matches)
pass out quick on wan_if reply-to (sink_utun sink_peer) flags any tagged PHONE keep state (if-bound)
