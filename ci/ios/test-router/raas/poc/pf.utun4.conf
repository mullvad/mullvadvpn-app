nat on en0 from client_ip to any -> (en0)

# forward traffic into source_utun from en0
pass in quick on en0 route-to source_utun from client_ip to any flags any no state

# tag phone flows as userspace injects them into sink_utun
pass in quick on sink_utun from client_ip to any flags any tag PHONE no state

# reply-to on the state steers replies back into sink_utun (rules are skipped for state matches)
pass out quick on en0 reply-to (sink_utun sink_peer) flags any tagged PHONE keep state (if-bound)

# final hop: replies injected into source_utun go straight to the phone
pass in quick on source_utun route-to (en0 client_ip) from any to client_ip flags any no state
