[package]
name = "mullvad-ios"
edition.workspace = true
rust-version.workspace = true
description = "Entry point for all FFI code on iOS"
repository.workspace = true
license.workspace = true

[lib]
bench = false
crate-type = ["staticlib"]

# Host-side binary that generates the uniffi Swift bindings for the uniffi FFI.
# Only built when explicitly requested (`--bin uniffi-bindgen --features uniffi-cli`);
# the normal iOS `--lib` build never compiles it.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos"))'.dependencies]
bytes = { workspace = true }
gotatun = { workspace = true, features = ["daita", "device", "tun"] }
hyper-util = { workspace = true }
ipnetwork = { workspace = true }
libc = "0.2"
log = { workspace = true }
nix = { workspace = true, features = ["uio"] }
rand = { workspace = true }
smoltcp = { version = "0.13", default-features = false, features = [
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "socket-icmp",
  "socket-tcp",
  "std",
] }
talpid-error.workspace = true
talpid-net = { path = "../talpid-net" }
talpid-netstack = { path = "../talpid-netstack" }
talpid-time = { path = "../talpid-time" }
talpid-tunnel-config-client = { path = "../talpid-tunnel-config-client" }
talpid-types = { path = "../talpid-types" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { workspace = true }
tower = { workspace = true }
tunnel-obfuscation = { path = "../tunnel-obfuscation", features = ["gotatun"] }
zerocopy = "0.8"

# Only used by the FFI exports, which are not compiled for macOS.
[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
chrono = { workspace = true }
futures = { workspace = true }
hyper = { version = "1.4.1", features = ["client", "http1"] }
mockito = { workspace = true }
mullvad-api = { path = "../mullvad-api", default-features = false }
mullvad-encrypted-dns-proxy = { path = "../mullvad-encrypted-dns-proxy" }
mullvad-logging = { path = "../mullvad-logging" }
mullvad-types = { path = "../mullvad-types" }
regex = "1"
shadowsocks = { workspace = true }
talpid-future = { path = "../talpid-future" }
tracing = "0.1"
tracing-subscriber = { workspace = true }
uniffi = { workspace = true }

# On macOS only the `uniffi-bindgen` binary uses uniffi, and only with the
# `uniffi-cli` feature. The library's own uniffi use is iOS/tvOS only.
[target.'cfg(target_os = "macos")'.dependencies]
uniffi = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }

[features]
# Allow the API server to be used
api-override = ["mullvad-api/api-override"]
# Enable the uniffi-bindgen CLI (only needed by the `uniffi-bindgen` binary).
uniffi-cli = ["uniffi/cli"]

[lints]
workspace = true
