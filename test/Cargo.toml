[workspace]
resolver = "2"
members = [
  "crates/am-i-mullvad-client",
  "crates/connection-checker",
  "crates/socks-server",
  "crates/test-manager",
  "crates/test-rpc",
  "crates/test-runner",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/mullvad/mullvadvpn-app/"
license = "GPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1.58"
bytes = "1.11.1"
chrono = { version = "0.4.26", default-features = false }
clap = { version = "4.2.7", features = ["cargo", "derive"] }
colored = "2.0.0"
dirs = "6.0.0"
env_logger = "0.11.7"
futures = "0.3"
gotatun = { version = "0.9.0", default-features = false, features = ["aws-lc-rs"] }
http-body-util = "0.1.2"
hyper = { version = "1.4.1", default-features = false }
hyper-rustls = { version = "0.27.3", default-features = false }
hyper-util = { version = "0.1.8", default-features = false, features = [
  "client-legacy",
  "http2",
] }
log = "0.4"
mullvad-api = { path = "../mullvad-api", features = ["api-override"] }
mullvad-api-constants = { path = "../mullvad-api/mullvad-api-constants" }
mullvad-daemon-relay-selector = { path = "../mullvad-daemon-relay-selector" }
mullvad-management-interface = { path = "../mullvad-management-interface" }
mullvad-paths = { path = "../mullvad-paths" }
mullvad-relay-selector = { path = "../mullvad-relay-selector" }
mullvad-types = { path = "../mullvad-types" }
mullvad-version = { path = "../mullvad-version" }
nix = { version = "0.30.1", features = ["ioctl", "net", "signal", "socket"] }
ping = "0.7.1"
rand = "0.9.3"
rustls = { version = "0.23", default-features = false }
serde = "1.0"
serde_json = "1.0"
socket2 = "0.5.7"
socks-server = { path = "crates/socks-server" }
surge-ping = "0.8"
talpid-macos = { path = "../talpid-macos" }
talpid-platform-metadata = { path = "../talpid-platform-metadata", default-features = false }
talpid-types = { path = "../talpid-types" }
talpid-windows = { path = "../talpid-windows" }
tarpc = { version = "0.31", features = ["serde-transport", "serde1", "tokio1"] }
test_macro = { path = "crates/test_macro" }
test-rpc = { path = "crates/test-rpc" }
thiserror = "2.0"
tipsy = "0.7.0"
tokio = { version = "1.44", default-features = false }
tokio-serial = "5.4.1"
tonic = "0.14.6"
tower = "0.5.1"
tun = "0.8.11"
windows-registry = "0.6.1"
windows-sys = "0.52.0"

[workspace.lints.clippy]
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
borrow_as_ptr = "warn"
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unicode_not_nfc = "warn"
unused_async = "deny"
wildcard_dependencies = "deny"

# Keep all lints in sync with `../Cargo.toml`
[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "deny"
# Easy to read style and opinionated best practices
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "deny"
missing_abi = "deny"
# Security
non_ascii_idents = "forbid"
# Deny old style Rust
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
