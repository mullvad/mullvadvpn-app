[package]
name = "mullvad-problem-report"
edition.workspace = true
rust-version.workspace = true
description = "Collect Mullvad VPN logs into a report and send it to support"
repository.workspace = true
license.workspace = true

[package.metadata.winresource]
ProductName = "Mullvad VPN"
CompanyName = "Mullvad VPN AB"
LegalCopyright = "(c) 2026 Mullvad VPN AB"
InternalName = "mullvad-problem-report"
OriginalFilename = "mullvad-problem-report.exe"

[dependencies]
dirs = { workspace = true }
log = { workspace = true }
mullvad-api.workspace = true
mullvad-paths.workspace = true
mullvad-version.workspace = true
regex = "1.0"
talpid-error.workspace = true
talpid-logging.workspace = true
talpid-platform-metadata.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
uuid = { version = "1.4.1", features = ["v4"] }

[build-dependencies]
mullvad-version.workspace = true
winresource.workspace = true

[target.'cfg(not(target_os="android"))'.dependencies]
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
