---
name: Rust - Run Clippy to check lints
on:
  pull_request:
    paths:
      - .github/workflows/clippy.yml
      - 'ci/cargo-ci.sh'
      - 'ci/cargo-ci-clippy.sh'
      - clippy.toml
      - '**/Cargo.toml'  # Lint rules defined in toml files
      - '**/*.rs'
      - '**/*.proto'
  # Runs on main to populate and refresh the Rust cache in mullvad-build-env
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  prepare-android:
    name: Prepare Android container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Use custom container image if specified
        if: ${{ github.event.inputs.override_container_image != '' }}
        run: echo "inner_container_image_android=${{ github.event.inputs.override_container_image }}"
          >> $GITHUB_ENV

      - name: Use default container image and resolve digest
        if: ${{ github.event.inputs.override_container_image == '' }}
        run: echo "inner_container_image_android=$(cat ./building/android-container-image.txt)" >> $GITHUB_ENV

    outputs:
      container_image_android: ${{ env.inner_container_image_android }}

  clippy-check-desktop:
    # Without an expression here the display name gets every matrix value
    # appended to it, which is more than is useful at this level.
    name: Clippy (${{ matrix.platform }})
    strategy:
      matrix:
        # Each target is the host's own, so no extra standard library is needed.
        include:
          - platform: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macOS
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # By default, the longest path a filename can have in git on Windows is 260 character.
      - name: Set git config for long paths
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/mullvad-build-env
        with:
          rustup-components: clippy

      - name: Clippy check
        shell: bash
        run: ci/cargo-ci-clippy.sh ${{ matrix.target }}

  clippy-check-android:
    name: Clippy (Android)
    needs: prepare-android
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-android.outputs.container_image_android }}

    steps:
      # Fix for HOME path overridden by GH runners when building in containers, see:
      # https://github.com/actions/runner/issues/863
      - name: Fix HOME path
        run: echo "HOME=/root" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # The script selects the Android packages from the target triple.
      - name: Clippy check
        run: ci/cargo-ci-clippy.sh x86_64-linux-android
