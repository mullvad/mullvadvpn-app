---
name: iOS app
on:
  pull_request:
    paths:
      - .github/workflows/ios.yml
      - ios/build-rust-library.sh
      - ios/.swift-format
      - ios/wireguard-apple
      - ios/**/*.swift
      - ios/**/*.xctestplan
      - ios/flake.*
      # Rust code is generally checked in the ios-rust-ffi.yml workflow,
      # But changing the Rust compiler can affect Swift->Rust linking not detected
      # by that workflow, so we trigger the full iOS build on it.
      - rust-toolchain.toml
      # Changes to the FFI can affect the linking but not be detected `ios-rust-ffi.yml`.
      - 'mullvad-ios/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  swift-format:
    name: Run swift format lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      # Since ubuntu 22.30, unprivileged usernamespaces are no longer allowed to map to the root user:
      # https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
      - name: Relax unpriviliged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: runner.os == 'Linux'

      - name: Run swift format lint
        run: nix develop --command ./format.sh lint -s
        working-directory: ios

  ui-test-build:
    name: Build for ui tests (staging)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SOURCE_PACKAGES_PATH: .spm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup project
        uses: ./.github/actions/ios/setup-project-toolchain
        with:
          ios_rust_target: aarch64-apple-ios

      - name: Record toolchain
        id: toolchain
        run: |
          echo "id=$(xcodebuild -version | sed -e 's/[^[:alnum:]_-]/-/g' | tr '\n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      - name: Restore cached build artifacts
        id: cache-xcodebuild-artifacts
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          key: artifacts-${{ steps.toolchain.outputs.id }}-${{ github.job }}-${{ github.ref_name }}
          path: |
            ios/derived-data/CompilationCache.noindex
            ios/derived-data/ModuleCache.noindex
            ios/derived-data/Build/Intermediates.noindex
            ios/derived-data/Build/Products

      - name: Build for ui tests
        run: |
          set -o pipefail && \
          env NSUnbufferedIO=YES \
          xcodebuild \
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
          -project MullvadVPN.xcodeproj \
          -scheme MullvadVPNUITests \
          -testPlan MullvadVPNUITestsAll \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
          -disableAutomaticPackageResolution \
          -allowProvisioningUpdates \
          -destination "generic/platform=iOS" \
          -derivedDataPath derived-data \
          build-for-testing 2>&1 | xcbeautify
        working-directory: ios/

      - name: Save CompilationCache
        uses: actions/cache/save@v6
        with:
          key: artifacts-${{ steps.toolchain.outputs.id }}-${{ github.job }}-${{ github.ref_name}}
          path: |
            ios/derived-data/CompilationCache.noindex
            ios/derived-data/ModuleCache.noindex
            ios/derived-data/Build/Intermediates.noindex
            ios/derived-data/Build/Products

  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SOURCE_PACKAGES_PATH: .spm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup project
        uses: ./.github/actions/ios/setup-project-toolchain

      - name: Record toolchain
        id: toolchain
        run: |
          echo "id=$(xcodebuild -version | sed -e 's/[^[:alnum:]_-]/-/g' | tr '\n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      - name: Restore cached build artifacts
        id: cache-xcodebuild-artifacts
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          key: artifacts-${{ steps.toolchain.outputs.id }}-${{ github.job }}-${{ github.ref_name }}
          path: |
            ios/derived-data/CompilationCache.noindex
            ios/derived-data/ModuleCache.noindex
            ios/derived-data/Build/Intermediates.noindex
            ios/derived-data/Build/Products

      - name: Run unit tests
        run: |
          set -o pipefail && env NSUnbufferedIO=YES xcodebuild \
            -project MullvadVPN.xcodeproj \
            -scheme MullvadVPN \
            -testPlan MullvadVPNCI \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            -allowProvisioningUpdates \
            -derivedDataPath derived-data \
            -resultBundlePath xcode-test-report \
            test 2>&1 | xcbeautify
        working-directory: ios/

      - name: Archive test report
        if: always()
        run: zip -r test-report.zip ios/xcode-test-report.xcresult

      - name: Save CompilationCache
        uses: actions/cache/save@v6
        with:
          key: artifacts-${{ steps.toolchain.outputs.id }}-${{ github.job }}-${{ github.ref_name}}
          path: |
            ios/derived-data/CompilationCache.noindex
            ios/derived-data/ModuleCache.noindex
            ios/derived-data/Build/Intermediates.noindex
            ios/derived-data/Build/Products

      - name: Store test report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-report
          path: test-report.zip
