# Run `clippy` on the `test` workspace
---
name: DES Testframework - Clippy
on:
  pull_request:
    paths:
      - .github/workflows/testframework-clippy.yml
      - 'test/**/*.rs'
      - 'test/**/Cargo.toml'  # Lint rules defined in toml files
      - clippy.toml
      - 'ci/cargo-ci.sh'
      - 'ci/cargo-ci-clippy.sh'
  # Runs on main to populate and refresh the Rust cache in mullvad-build-env
  schedule:
    - cron: '20 3 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  clippy-check-test:
    # Without an expression here the display name gets every matrix value
    # appended to it, which is more than is useful at this level.
    name: Clippy (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Each target is the host's own, so no extra standard library is needed.
        include:
          - platform: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macOS
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # By default, the longest path a filename can have in git on Windows is 260 character.
      - name: Set git config for long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/mullvad-build-env
        with:
          rustup-components: clippy
          workspaces: test

      - name: Clippy check
        working-directory: test
        shell: bash
        run: ../ci/cargo-ci-clippy.sh ${{ matrix.target }}
