---
name: Desktop - End-to-end nightly tests
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}

# Run Linux, Windows and macOS in parallel.
jobs:
  run-linux:
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      oses: "debian13 ubuntu2404 ubuntu2604 ubuntu2610 fedora43 fedora44 fedora45"
  run-windows:
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      oses: "windows10 windows11"
  run-macos:
    uses: ./.github/workflows/desktop-e2e.yml
    with:
      oses: "macos15 macos26 macos27"
