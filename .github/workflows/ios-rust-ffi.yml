---
name: iOS - Build and test Rust FFI (mullvad-ios and mullvad-api)
on:
  pull_request:
    paths:
      - .github/workflows/ios-rust-ffi.yml
      - clippy.toml
      - 'ci/cargo-ci.sh'
      - Cargo.lock
      - Cargo.toml
      - '**/*.rs'
      - 'mullvad-ios/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  build-ios:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --depth=1 --recursive ios/wireguard-apple

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        run: |
          rustup target add ${{ matrix.target }}
          rustup component add clippy

      - name: Build crates
        shell: bash
        run: |
          time ci/cargo-ci.sh build --verbose --lib -p mullvad-ios -p mullvad-api --target ${{ matrix.target }}

      - name: Test crates
        shell: bash
        # NOTE: Tests actually target macOS here. This is because we do not have an iOS runner
        #       handy. The command takes no target, so it only needs to run on one matrix leg.
        if: matrix.target == 'aarch64-apple-ios'
        run: time ci/cargo-ci.sh test --verbose --lib -p mullvad-ios -p mullvad-api

      - name: Clippy check
        shell: bash
        run: |
          time ci/cargo-ci.sh clippy --all-targets --no-default-features -p mullvad-ios -p mullvad-api \
            --target ${{ matrix.target }}
          time ci/cargo-ci.sh clippy --all-targets --all-features -p mullvad-ios -p mullvad-api \
            --target ${{ matrix.target }}
