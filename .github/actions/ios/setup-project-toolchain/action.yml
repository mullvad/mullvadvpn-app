name: 'Setup project toolchain'
description: 'Setup Xcode project and install toolchain'
inputs:
  ios_rust_target:
    description: 'iOS target device'
    type: choice
    default: aarch64-apple-ios-sim
    options:
      - aarch64-apple-ios-sim
      - aarch64-apple-ios
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout submodules
      run: |
        git config --global --add safe.directory '*'
        git submodule update --init --depth=1 --recursive ios/wireguard-apple
      shell: bash

    - name: Do not track changes to ${{ env.SOURCE_PACKAGES_PATH }}
      run: |
        # Record the pattern in .git/info/exclude (a local-only file).
        exclude_file="$(git rev-parse --path-format=absolute --git-path info/exclude)"
        exclude_pattern="ios/${SOURCE_PACKAGES_PATH}"

        # Idempotency:
        # Only add it if the exact line isn't already there, which is relevant for
        # self-hosted runners which have a long-lived workspace.
        if ! grep -qxF -- "$exclude_pattern" "$exclude_file"; then
          printf '%s\n' "$exclude_pattern" >> "$exclude_file"
        fi
      shell: bash

    - name: Configure cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ios/${{ env.SOURCE_PACKAGES_PATH }}
        key: ${{ runner.os }}-spm-${{ hashFiles('ios/**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Setup go-lang
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version: 1.21.13

    # Our scripts hard-code `$HOME/cargo/bin` as the expected path for `cargo`,
    # which is also documented as the default expected path.
    # Due to https://github.com/actions/runner-images/pull/14990, the path changed
    # and our Xcode build-scripts fail. This corrects that while waiting for upstream
    # to resolve it.
    - name: Install Rustup
      run: |
        RUSTUP_VERSION=1.29.2
        TARGET=aarch64-apple-darwin
        BASE="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${TARGET}"
        curl --proto '=https' --tlsv1.2 -sSfO "$BASE/rustup-init"
        curl --proto '=https' --tlsv1.2 -sSfO "$BASE/rustup-init.sha256"

        echo "Checking checksum"
        sha256sum -c rustup-init.sha256

        echo "Installing"
        chmod +x rustup-init
        ./rustup-init -y --profile minimal
        rm -f ./rustup-init*

        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Configure Rust
      run: |
        which cargo
        rustup target add ${{ inputs.ios_rust_target }}
      shell: bash

    - name: Update brew's internal repository
      run: brew update
      shell: bash

    - name: Install xcbeautify
      run: |
        brew install xcbeautify
      shell: bash

    - name: Install protobuf
      run: |
        brew install protobuf
      shell: bash

    - name: Install ripgrep
      run: |
        brew install ripgrep
      shell: bash

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Configure Xcode project
      run: |
          for file in *.xcconfig.template ; do cp $file ${file//.template/} ; done
      working-directory: ios/Configurations
      shell: bash
