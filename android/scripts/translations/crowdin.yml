#
# Relay locations are not managed here. They are translated with shared relay-locations.pot.
#

project_id: '350815'
api_token_env: CROWDIN_API_KEY
base_path: ../../
base_url: https://api.crowdin.com
preserve_hierarchy: false
files:
# App strings
  - source: "lib/ui/resource/src/main/res/values/strings.xml"
    translation: "/lib/ui/resource/src/main/res/values-%two_letters_code%/%original_file_name%"
    skip_untranslated_strings: true
    languages_mapping:
      two_letters_code:
        zh-CN: zh-rCN
        zh-TW: zh-rTW

# App plurals
  - source: "lib/ui/resource/src/main/res/values/plurals.xml"
    translation: "/lib/ui/resource/src/main/res/values-%two_letters_code%/%original_file_name%"
    skip_untranslated_strings: true
    languages_mapping:
      two_letters_code:
        zh-CN: zh-rCN
        zh-TW: zh-rTW

