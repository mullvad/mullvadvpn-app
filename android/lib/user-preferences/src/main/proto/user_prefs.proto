syntax = "proto3";

option java_package = "net.mullvad.mullvadvpn.lib.userpreferences";
option java_multiple_files = true;

message UserPreferences {
  bool is_privacy_disclosure_accepted = 1;
  int32 last_shown_changelog_version_code = 2;
  int64 account_expiry_unix_time_seconds = 3;
  bool show_android_16_connect_warning = 4;
  bool show_location_in_system_notification = 5;
  bool show_system_apps_split_tunneling = 6;
  bool has_seen_multihop_migration_guide = 7;
  bool has_dismissed_multihop_migration_guide_banner = 8;
  optional string latest_successful_purchase = 9;
  bool notification_permission_asked = 10;
  OnboardingCheckpointProto onboarding_checkpoint = 11;
}

enum OnboardingCheckpointProto {
  ONBOARDING_CHECKPOINT_NOT_STARTED = 0;
  ONBOARDING_CHECKPOINT_WELCOME = 1;
  ONBOARDING_CHECKPOINT_NOTIFICATIONS = 2;
  ONBOARDING_CHECKPOINT_GOOD_TO_KNOW = 3;
  ONBOARDING_CHECKPOINT_PART_1_COMPLETED = 4;
  ONBOARDING_CHECKPOINT_PREFERRED_SETTINGS = 5;
  ONBOARDING_CHECKPOINT_COMPLETED = 6;
}
