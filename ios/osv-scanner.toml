# Entire package ignored since there is a constant stream of newly found regular expression attacks.
# All of these attacks rely on the input being malicious. We only use this package in our trusted
# build environment with trusted inputs.
[[PackageOverrides]]
effectiveUntil = 2026-05-01  # Ignored for 6 months at a time, it is unlikely to be an issue.
ignore = true
name = "rexml"
reason = "The XML payload is generated by Apple tooling which we trust"

# The redirect middleware in excon is not redacting sensitive headers when following redirects
# This vulnerability is fixed in excon version > 1.5.0 which fastlane cannot yet use, since it would require
# a minimum ruby version of 3.1 which is above their current minimum target of 3.0
[[IgnoredVulns]]
id = "CVE-2026-54171"  # GHSA-48rx-c7pg-q66r
ignoreUntil = 2026-09-19
reason = "We trust Apple to not abuse redirects to leak sensitive headers and cannot currently update to a non vulneable version"
